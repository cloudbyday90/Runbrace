# SPDX-License-Identifier: GPL-3.0-only
name: Input reader regressions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  descriptor-reader:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test --test-concurrency=1 --test-timeout=40000 tools/contracts-ajv/test/read-input.test.mjs
