# SPDX-License-Identifier: GPL-3.0-only
rules:
  - id: runbrace-php-no-eval
    languages: [php]
    severity: ERROR
    message: Dynamic code evaluation is prohibited in Runbrace's offline PHP surface.
    pattern: eval(...)
  - id: runbrace-php-no-unserialize
    languages: [php]
    severity: ERROR
    message: PHP object deserialization is prohibited; use validated JSON contracts.
    pattern: unserialize(...)
  - id: runbrace-php-no-process-execution
    languages: [php]
    severity: ERROR
    message: Process execution is prohibited in the offline PHP formatter and tests.
    pattern-either:
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: shell_exec(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)
